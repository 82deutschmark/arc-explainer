<!doctype html>
<!-- Author: Claude Opus 5.5 Medium; Date: 08-November-2026; PURPOSE: Unlisted review copy of the Turducken write-up
     (2026-11-06-arc3-solution-draft.html) where reviewers select text and leave shared, Google-Docs-style comments.
     The article itself is fetched live from its own page and never edited here; comments are stored by
     /api/review-comments (server/routes/reviewComments.ts). Behaviour: review-editor/review-editor.js.
     SRP/DRY check: Pass — page shell only; article text and styles come from the article page itself. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Review: Stuffing the Turducken</title>
<link rel="stylesheet" href="review-editor/review-editor.css" data-rv-css>
<script src="review-editor/review-editor.js" defer></script>
</head>
<body class="rv-body"
      data-review-doc="turducken-2026-11-06"
      data-review-article="2026-11-06-arc3-solution-draft.html"
      data-review-api="/api/review-comments">
<header class="rv-bar">
  <span class="rv-title" id="rv-doc-title">Review: Stuffing the Turducken</span>
  <span class="rv-spacer"></span>
  <span class="rv-status rv-hide-narrow" id="rv-status">Loading…</span>
  <label><span class="rv-hide-narrow">Your name</span> <input type="text" id="rv-author" maxlength="60" autocomplete="name" placeholder="Your name"></label>
  <button class="rv-btn rv-primary" type="button" id="rv-export-btn" title="All open comments as plain text, ready to paste to an agent">Export open</button>
  <button class="rv-btn rv-hide-narrow" type="button" id="rv-backup-btn" title="Download every comment as a JSON backup">Backup</button>
  <button class="rv-btn rv-hide-narrow" type="button" id="rv-restore-btn" title="Load comments from a JSON backup">Restore</button>
  <input type="file" id="rv-restore-file" accept="application/json,.json" hidden>
  <button class="rv-btn rv-toggle" type="button" id="rv-toggle">Comments</button>
</header>
<div class="rv-banner" id="rv-banner" hidden></div>

<main id="rv-article"><p style="font:15px system-ui;color:#4c5258;padding:40px 0">Loading the article…</p></main>

<button class="rv-add" id="rv-add" type="button">Comment</button>

<aside class="rv-panel" id="rv-panel" aria-label="Comments">
  <div class="rv-panel-head">
    <button class="rv-tab" type="button" data-filter="open" id="rv-tab-open">Open</button>
    <button class="rv-tab" type="button" data-filter="resolved" id="rv-tab-resolved">Resolved</button>
    <button class="rv-tab" type="button" data-filter="all">All</button>
    <button class="rv-btn rv-quiet rv-panel-close" type="button" id="rv-panel-close">Close</button>
  </div>
  <div class="rv-list" id="rv-list"></div>
</aside>

<dialog class="rv-dialog" id="rv-export">
  <div class="rv-dialog-body">
    <h2>Open comments</h2>
    <p>Every open comment with its section and the exact quoted text. Copy it and paste it to an agent to apply the edits.</p>
    <textarea class="rv-input" readonly></textarea>
    <div class="rv-actions">
      <button class="rv-btn" type="button" data-download>Download .txt</button>
      <button class="rv-btn rv-primary" type="button" data-copy>Copy</button>
      <button class="rv-btn rv-quiet" type="button" data-close>Close</button>
    </div>
  </div>
</dialog>
</body>
</html>
